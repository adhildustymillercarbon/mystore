Transform: AWS::Serverless-2016-10-31
Resources:
  OrderApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: OrderApi
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: {}
        paths:
          /orders:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateOrder.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        AllowOrigin: '''*'''
        MaxAge: 5
  CreateOrder:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: CreateOrder
      CodeUri: src/CreateOrder
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          ORDERTABLE_TABLE_NAME: !Ref OrderTable
          ORDERTABLE_TABLE_ARN: !GetAtt OrderTable.Arn
          ORDERNOTIFICATIONQUEUE_QUEUE_NAME: !GetAtt OrderNotificationQueue.QueueName
          ORDERNOTIFICATIONQUEUE_QUEUE_ARN: !GetAtt OrderNotificationQueue.Arn
          ORDERNOTIFICATIONQUEUE_QUEUE_URL: !Ref OrderNotificationQueue
      Events:
        OrderApiPOSTorders:
          Type: Api
          Properties:
            Path: /orders
            Method: POST
            RestApiId: !Ref OrderApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrderTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OrderNotificationQueue.QueueName
  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateOrder}
  OrderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  OrderNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
  ProcessPayment:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: ProcessPayment
      CodeUri: src/ProcessPayment
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          UPDATEINVENTORY_FUNCTION_NAME: !Ref UpdateInventory
          UPDATEINVENTORY_FUNCTION_ARN: !GetAtt UpdateInventory.Arn
      Events:
        OrderNotificationQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderNotificationQueue.Arn
            BatchSize: 1
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref UpdateInventory
  ProcessPaymentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProcessPayment}
  UpdateInventory:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: UpdateInventory
      CodeUri: src/UpdateInventory
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Environment: {}
      Events:
        OrderTable:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt OrderTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 1
  UpdateInventoryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UpdateInventory}